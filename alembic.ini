# Configuração do banco de dados para o sistema Fila Zero Saúde

[alembic]
# caminho para os scripts de migração (relativo à localização deste arquivo)
script_location = %(here)s/alembic

# template usado para gerar nomes dos arquivos de migração
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, adicionado ao início do sys.path se presente
prepend_sys_path = .

# timezone para renderização de datas nas migrações
# timezone =

# comprimento máximo do campo "slug"
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without source
# sourceless = false

# localização das versões
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

path_separator = os

# set to 'true' to search source files recursively
# recursive_version_locations = false

# encoding de saída para arquivos de migração
# output_encoding = utf-8

# URL do banco de dados (SQLite para desenvolvimento local)
sqlalchemy.url = sqlite:///app/banco.db


[post_write_hooks]
# hooks de pós-escrita para formatação de código
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Configuração de Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S